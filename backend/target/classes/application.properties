# Server Configuration
server.port=8080
server.address=0.0.0.0
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bitesharing?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=90964740
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
jwt.secret=${JWT_SECRET:YourSecretKeyForJWTTokenGeneration12345678901234567890}
jwt.expiration=86400000

# Google Maps API
google.maps.api.key=${GOOGLE_MAPS_API_KEY:YOUR_GOOGLE_MAPS_API_KEY}

# SMS API Configuration (Twilio or similar)
sms.api.key=${SMS_API_KEY:YOUR_SMS_API_KEY}
sms.api.secret=${SMS_API_SECRET:YOUR_SMS_API_SECRET}
twilio.account.sid=${TWILIO_ACCOUNT_SID:YOUR_TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN:YOUR_TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+10000000000}
twilio.webhook.path=/api/sms/webhook
twilio.webhook.validate-signature=${TWILIO_VALIDATE_SIGNATURE:true}

# Stripe Checkout (test mode)
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.checkout.success-url=${STRIPE_CHECKOUT_SUCCESS_URL:http://localhost:3000}
stripe.checkout.cancel-url=${STRIPE_CHECKOUT_CANCEL_URL:http://localhost:3000}

# CORS Configuration
cors.allowed.origins=http://localhost:3000

# File Storage
file.upload.dir=./uploads

# Python food freshness service (FastAPI). Point Spring RestTemplate/WebClient here.
# Example: http://localhost:8000/predict — multipart field name must be "file".
freshness.api.base-url=http://localhost:8000
# Freshness: SIMULATED | PYTHON | GEMINI | HYBRID | PYTHON_OR_GEMINI | GEMINI_OR_PYTHON
# - PYTHON: Keras service only (freshness_fixed.h5)
# - GEMINI: Google vision only (gemini.api.key)
# - HYBRID: CNN first; Gemini if CNN confidence < freshness.hybrid.gemini-fallback-threshold or CNN down
# - PYTHON_OR_GEMINI: CNN first; on failure use Gemini if key set
# - GEMINI_OR_PYTHON: Gemini first; on UNKNOWN/error use CNN
# Engine is never selected from the browser — only this property (+ keys) decides.
freshness.mode=GEMINI
freshness.hybrid.gemini-fallback-threshold=0.58
# Label stored/returned for donations (hides whether Gemini or Keras was used).
freshness.client-model-label=food-freshness-v1
# If true, a donation with a local photo URL must get a successful server AI call or publish fails.
freshness.publish.require-successful-ml=false
# Gemini (used for GEMINI, HYBRID, PYTHON_OR_GEMINI, GEMINI_OR_PYTHON). Use a vision-capable model id.
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}
gemini.temperature=0.12
# If the API rejects responseSchema, we retry without it automatically when this is true.
gemini.freshness.use-json-mode=true
server.tomcat.basedir=C:/temp
# Help chatbot: FAQ from classpath chatbot/knowledge.json. Optional Ollama (OSS) boost.
chatbot.ollama.enabled=true
chatbot.ollama.base-url=http://localhost:11434
chatbot.ollama.model=llama3.2

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Place your trained Keras model next to freshness/predict.py as freshness_fixed.h5 (or set FOOD_MODEL_PATH).